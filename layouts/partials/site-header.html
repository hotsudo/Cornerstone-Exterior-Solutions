<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="Cornerstone Exterior Solutions home">
      <span class="brand-name">Cornerstone</span>
      <span class="brand-detail">Exterior Solutions</span>
    </a>
    <nav aria-label="Main navigation">
      <ul>
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}"{{ if $currentPage.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
