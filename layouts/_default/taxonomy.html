{{ define "main" }}
  <article class="content">
    <div>{{ .Content }}</div>

    <p>You’re viewing articles in <strong>{{ .Title }}</strong>. <a href="/posts/">View all articles</a>.</p>

    <ol class="post-list">
      {{ range .Paginator.Pages }}
        {{ .Render "summary" }}
      {{ end }}
    </ol>

    {{ template "_internal/pagination.html" . }}
  </article>
{{ end }}
