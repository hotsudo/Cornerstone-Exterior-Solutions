{{ define "main" }}
	<article class="content">
		<div>{{ .Content }}</div>

		<div class="columns">
			<div class="column">
				<label>Phone Number</label>
				<p class="contact-info"><a href="tel:+15732302241">{{ hugo.Data.company.phone }}</a></p>

				<label>Email Address</label>
				<p class="contact-info"><a href="mailto:{{ hugo.Data.company.contact_email_address }}">{{ hugo.Data.company.contact_email_address }}</a></p>

				<label>Service Area</label>
				<p class="contact-info">{{ hugo.Data.company.service_area }}</p>
			</div>

			<div class="column">
				<form name="contact" method="post" action="/contact-success/" data-netlify="true" netlify-honeypot="bot-field">
					<input type="hidden" name="form-name" value="contact">
					<p class="form-hidden"><label>Do not fill this out if you are human: <input name="bot-field"></label></p>

					<label for="name">Name</label>
					<input id="name" type="text" name="name" autocomplete="name" required>

					<label for="email_address">Email Address</label>
					<input id="email_address" type="email" name="email" autocomplete="email" required>

					<label for="phone">Phone Number</label>
					<input id="phone" type="tel" name="phone" autocomplete="tel">

					<label for="project_type">Project Type</label>
					<select id="project_type" name="project_type">
						<option value="">Select a service</option>
						<option>Roofing</option>
						<option>Gutters</option>
						<option>Leaf Removal</option>
						<option>Christmas Lighting</option>
						<option>Other exterior project</option>
					</select>

					<label for="message">Message</label>
					<textarea id="message" name="message" required></textarea>

					<input type="submit" value="Request Free Estimate">
				</form>
			</div>
		</div>
	</article>
{{ end }}
