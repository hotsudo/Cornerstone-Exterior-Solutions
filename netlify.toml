[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep old links working after the domain move, including paths and query strings.
[[redirects]]
  from = "https://cornerstoneexteriorsolutions.co/*"
  to = "https://cornerstonecrewmo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cornerstoneexteriorsolutions.co/*"
  to = "https://cornerstonecrewmo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cornerstoneexteriorsolutions.co/*"
  to = "https://cornerstonecrewmo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cornerstoneexteriorsolutions.co/*"
  to = "https://cornerstonecrewmo.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contact-success"
  to = "/contact-success/"
  status = 301
